{{ define "blogs" }}

{{ template "base_head" . }}
<title>All Blogs</title>
</head>

<body>
  {{ if .Content.User}}
    <h3> Hello {{ .Content.User.Username }} </h3>
    <a href="/blogs/create" class="button">Create a blog</a>
  {{ end }}
  {{ range .Content.Blogs }}
  <div class="blog-entry">
    <a href="/blogs/{{ .Id }}">{{ .Title }}</a>
  </div>
  {{ else }}
  <p>No blog posts found.</p>
  {{ end }}

{{ template "base_footer" .}}

{{ end }}
